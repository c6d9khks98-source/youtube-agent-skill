<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* messages: phone-style notification banners that pop in over the clip, one per line of text.
     Transparent page; rendered frame by frame and laid OVER the clip. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden;
               font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
  #stack { position: absolute; left: 48px; right: 48px; top: 140px; display: flex;
           flex-direction: column; gap: 22px; }
  .note { display: flex; gap: 26px; align-items: center; padding: 30px 34px; border-radius: 48px;
          background: rgba(246, 246, 248, 0.94); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
          opacity: 0; transform-origin: 50% 0; }
  .icon { flex: none; width: 92px; height: 92px; border-radius: 22px;
          background: linear-gradient(#67e36d, #2fc23b); display: grid; place-items: center; }
  .icon svg { width: 58px; height: 58px; fill: #fff; }
  .body { flex: 1; min-width: 0; }
  .row { display: flex; justify-content: space-between; font-size: 30px; color: #6b6b70; }
  .row b { color: #111; font-size: 32px; }
  .text { font-size: 38px; color: #111; margin-top: 6px; line-height: 1.25; }
</style>
</head>
<body>
<div id="stack"></div>
<script>
  // Params (URL hash JSON): {items: [...], app: "Messages", start: 0.3, gap: 0.7}
  const P = Object.assign({ items: ['how did you edit this??'], app: 'Messages', start: 0.3, gap: 0.7 },
                          JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}')));
  const stack = document.getElementById('stack');
  const notes = P.items.map(t => {
    const n = document.createElement('div');
    n.className = 'note';
    n.innerHTML = `<div class="icon"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.7 2 11.2c0 2.6 1.5 4.9 3.8 6.4L5 21l3.9-2.1c1 .3 2 .4 3.1.4 5.5 0 10-3.7 10-8.2S17.5 3 12 3z"/></svg></div>
      <div class="body"><div class="row"><b></b><span>now</span></div><div class="text"></div></div>`;
    n.querySelector('b').textContent = P.app;
    n.querySelector('.text').textContent = t;
    stack.appendChild(n);
    return n;
  });
  // easeOutBack: a small overshoot reads as a "pop".
  const ease = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  window.seek = t => notes.forEach((n, i) => {
    const k = Math.min(1, Math.max(0, (t - P.start - i * P.gap) / 0.28));
    n.style.opacity = Math.min(1, k * 2);
    n.style.transform = `translateY(${(1 - ease(k)) * -60}px) scale(${0.88 + 0.12 * ease(k)})`;
  });
  window.seek(0);
</script>
</body>
</html>
