<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* toggles: a frosted card of settings-style switches that flip on one by one over the clip.
     Transparent page; rendered frame by frame and laid OVER the clip. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden;
               font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
  #card { position: absolute; left: 90px; right: 90px; top: 1180px; padding: 12px 44px;
          border-radius: 44px; background: rgba(255, 255, 255, 0.9);
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3); opacity: 0; }
  .item { display: flex; align-items: center; justify-content: space-between; height: 128px;
          font-size: 44px; color: #111; }
  .item + .item { border-top: 2px solid #e4e4e8; }
  .sw { width: 128px; height: 76px; border-radius: 38px; background: #e2e2e6; position: relative; }
  .knob { position: absolute; top: 5px; left: 5px; width: 66px; height: 66px; border-radius: 50%;
          background: #fff; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25); }
</style>
</head>
<body>
<div id="card"></div>
<script>
  // Params (URL hash JSON): {items: [...], start: 0.4, gap: 0.8}
  const P = Object.assign({ items: ['One clip', 'Type one command', 'Zero editing apps'], start: 0.4, gap: 0.8 },
                          JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}')));
  const card = document.getElementById('card');
  const rows = P.items.map(t => {
    const r = document.createElement('div');
    r.className = 'item';
    r.innerHTML = '<span></span><div class="sw"><div class="knob"></div></div>';
    r.querySelector('span').textContent = t;
    card.appendChild(r);
    return r;
  });
  const smooth = x => x * x * (3 - 2 * x);
  window.seek = t => {
    const c = smooth(Math.min(1, Math.max(0, t / 0.3)));
    card.style.opacity = c;
    card.style.transform = `translateY(${(1 - c) * 40}px)`;
    rows.forEach((r, i) => {
      const k = smooth(Math.min(1, Math.max(0, (t - P.start - i * P.gap) / 0.22)));
      // Grey (226,226,230) to green (52,199,89) as the knob slides across.
      const mix = (a, b) => Math.round(a + (b - a) * k);
      r.querySelector('.sw').style.background = `rgb(${mix(226, 52)},${mix(226, 199)},${mix(230, 89)})`;
      r.querySelector('.knob').style.transform = `translateX(${k * 52}px)`;
    });
  };
  window.seek(0);
</script>
</body>
</html>
